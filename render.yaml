# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push to GitHub, then New → Blueprint and point Render at this repo.
services:
  - type: web
    name: remy
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Supabase SESSION pooler URL (port :5432). Secret — set in the dashboard,
      # not in this file. Unset ⇒ the app falls back to ephemeral SQLite.
      - key: DATABASE_URL
        sync: false
      # remy's isolated Postgres schema (a namespace inside the one database).
      - key: DB_SCHEMA
        value: remy
      # Keep the pool small behind the pooler / free tier.
      - key: PGPOOL_MAX
        value: "3"
      # One gunicorn worker so first-boot seeding can't race (see Dockerfile).
      - key: WEB_CONCURRENCY
        value: "1"
